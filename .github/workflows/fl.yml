# Робот ленты FL.ru (fl.json). Выключен по просьбе владельца (15.11.2026): сам не запускается,
# только вручную кнопкой «Run workflow». Чтобы включить снова — вернуть блок schedule с cron.
name: Лента FL.ru
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fl_fetch.py
      - run: |
          git config user.name "fl-bot"
          git config user.email "fl-bot@users.noreply.github.com"
          git add fl.json
          git diff --cached --quiet || (git commit -m "Лента FL.ru" && git push)
